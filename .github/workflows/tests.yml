name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (core, no GPU extras)
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

      - name: Run the benchmark (numbers only, no figures)
        run: python benchmarks/run_benchmark.py --no-figures
