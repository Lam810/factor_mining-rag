[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-rag"
version = "0.2.0"
description = "Structure-aware Markdown chunking for retrieval over visually rich documents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Zeteng Lin" }]
keywords = ["rag", "chunking", "retrieval", "documents", "tables"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = []

[project.optional-dependencies]
rag = ["chromadb>=0.5", "sentence-transformers>=2.2", "requests>=2.28", "tqdm>=4.65"]
vllm = ["vllm>=0.6"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Lam810/factor_mining-rag"
Author = "https://lam810.github.io/"

[tool.setuptools.packages.find]
include = ["factor_rag*"]
