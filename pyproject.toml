[project]
name = "factor-rag"
version = "0.1.0"
description = "Structure-preserving RAG for visually rich documents: tables, figures and formulas survive chunking intact."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Zeteng Lin", email = "zeng.bol@northeastern.edu" }]
keywords = ["rag", "retrieval-augmented-generation", "markdown", "chunking", "document-ai", "visually-rich-documents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "tqdm>=4.65",
]

[project.optional-dependencies]
# Everything needed to run the actual retrieval + generation pipeline
# (chunking, metrics and viz have zero dependencies beyond tqdm).
serve = [
  "chromadb>=0.5",
  "numpy>=1.24",
  "openai>=1.30",       # OpenRouter speaks the OpenAI wire protocol
]
dev = [
  "pytest>=7.4",
]

[project.urls]
Homepage = "https://github.com/Lam810/factor_mining-rag"
Repository = "https://github.com/Lam810/factor_mining-rag"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["factor_rag*"]

[tool.pytest.ini_options]
# scripts/manual_smoke_test.py defines test_*() functions too, but it is an
# opt-in, GPU + API-key-requiring manual script, not part of the automated
# suite -- see its module docstring.
testpaths = ["tests"]
